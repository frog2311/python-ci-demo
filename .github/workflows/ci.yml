name: Python CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Lấy source
      uses: actions/checkout@v3

    - name: Cài Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài thư viện
      run: |
        pip install -r requirements.txt

    - name: Chạy test
      run: |
        pytest
